<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حضور المناوبات - االابتدائية الثالثة</title>
    <style>
        :root {
            --primary-green: #1b5e20;
            --light-green: #2e7d32;
            --bg-green: #f1f8e9;
            --error-red: #d32f2f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-green);
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* رأس الصفحة */
        header {
            background-color: #ffffff;
            border-bottom: 3px solid var(--primary-green);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-right {
            font-weight: bold;
            color: var(--primary-green);
            font-size: 1.1rem;
        }

        /* تنسيق شعار وزارة التعليم في اليسار */
        .header-left img {
            height: 45px;
            width: auto;
            display: block;
        }

        .datetime-display {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
        }

        /* محتوى النموذج */
        .container {
            max-width: 650px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h2 {
            text-align: center;
            color: var(--primary-green);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        /* تنسيق النجمة الحمراء */
        .required-star {
            color: var(--error-red);
            margin-right: 3px;
        }

        /* تنسيق النص الإضافي بجانب التوقيع */
        .sub-label-red {
            color: var(--error-red);
            font-size: 0.8rem;
            font-weight: normal;
            margin-right: 5px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-green);
            outline: none;
        }

        /* لوحة التوقيع */
        .signature-container {
            border: 2px dashed #ccc;
            border-radius: 6px;
            background-color: #fafafa;
            position: relative;
            height: 150px;
            cursor: crosshair;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .clear-sig {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: #e0e0e0;
            border: none;
            padding: 4px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .clear-sig:hover {
            background: #d5d5d5;
        }

        /* زر الإرسال */
        .btn-submit {
            background-color: var(--primary-green);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: var(--light-green);
        }

        /* رسالة الخطأ الحمراء */
        #error-msg {
            color: var(--error-red);
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- رأس الصفحة -->
    <header>
        <div class="header-right">الابتدائية الثالثة</div>
        <div class="datetime-display" id="live-datetime">جاري تحميل الوقت...</div>
        <!-- الشعار الرسمي لوزارة التعليم السعودية -->
        <div class="header-left">
            <img src="https://images.seeklogo.com/logo-png/43/2/ministry-of-education-saudi-arabia-logo-png_seeklogo-431871.png" alt="شعار وزارة التعليم">
        </div>
    </header>

    <!-- صفحة تسجيل الحضور للمستخدمين (المعلمات/المساعدات) -->
    <div class="container">
        <h2>تسجيل حضور المناوبات اليومية</h2>
        
        <div id="error-msg">عبي كل الخانات</div>

        <form id="duty-form">
            <div class="form-group">
                <label for="fullname">الاسم الثلاثي: <span class="required-star">*</span></label>
                <input type="text" id="fullname" placeholder="أدخلي اسمك الثلاثي هنا">
            </div>

            <div class="form-group">
                <label for="job-title">المسمى الوظيفي: <span class="required-star">*</span></label>
                <select id="job-title">
                    <option value="">اختري المسمى الوظيفي</option>
                    <option value="معلمة">معلمة</option>
                    <option value="مساعد إداري">مساعد إداري</option>
                </select>
            </div>

            <div class="form-group">
                <label for="duty-type">نوع المناوبة: <span class="required-star">*</span></label>
                <select id="duty-type">
                    <option value="">اختري نوع المناوبة</option>
                    <option value="صباحية">صباحية</option>
                    <option value="فسحة">فسحة</option>
                    <option value="انصراف">انصراف</option>
                </select>
            </div>

            <div class="form-group">
                <label for="duty-location">مكان المناوبة: <span class="required-star">*</span></label>
                <select id="duty-location">
                    <option value="">اختري المكان</option>
                    <option value="الممر الرئيسي">الممر الرئيسي</option>
                    <option value="ممر سادس">ممر سادس</option>
                </select>
            </div>

            <div class="form-group">
                <label>التوقيع: <span class="required-star">*</span><span class="sub-label-red">(يدوي بالإصبع)</span></label>
                <div class="signature-container">
                    <canvas id="sig-canvas"></canvas>
                    <button type="button" class="clear-sig" id="clear-canvas">مسح التوقيع</button>
                </div>
            </div>

            <button type="button" class="btn-submit" onclick="submitForm()">إرسال الحضور</button>
        </form>
    </div>

    <script>
        // رابط قوقل سكربت الخاص بك
        const SCRIPT_URL = "ضعِ_رابط_قوقل_سكربت_هنا";

        // تحديث التاريخ والوقت الحي
        function updateDateTime() {
            const now = new Date();
            const options = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById('live-datetime').innerText = now.toLocaleString('ar-SA', options);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // إعداد لوحة التوقيع (باللون الأسود)
        const canvas = document.getElementById('sig-canvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let hasSigned = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        function startPosition(e) {
            painting = true;
            hasSigned = true;
            draw(e);
        }

        function endPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000000';

            const rect = canvas.getBoundingClientRect();
            let x = (e.clientX || e.touches[0].clientX) - rect.left;
            let y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', (e) => { startPosition(e); e.preventDefault(); });
        canvas.addEventListener('touchend', (e) => { endPosition(); e.preventDefault(); });
        canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });

        document.getElementById('clear-canvas').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasSigned = false;
        });

        // إرسال النموذج والتحقق من الخانات وإرسالها لجدول قوقل
        function submitForm() {
            const fullname = document.getElementById('fullname').value.trim();
            const jobTitle = document.getElementById('job-title').value;
            const dutyType = document.getElementById('duty-type').value;
            const dutyLocation = document.getElementById('duty-location').value;
            const errorMsg = document.getElementById('error-msg');

            if (!fullname || !jobTitle || !dutyType || !dutyLocation || !hasSigned) {
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';

            const formData = {
                fullname: fullname,
                jobTitle: jobTitle,
                dutyType: dutyType,
                dutyLocation: dutyLocation
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            }).then(() => {
                alert('تم تسجيل حضور المناوبة بنجاح!');
                document.getElementById('duty-form').reset();
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hasSigned = false;
            }).catch(error => {
                alert('حدث خطأ أثناء الإرسال، تأكدي من الاتصال.');
            });
        }
    </script>
</body>
</html>
