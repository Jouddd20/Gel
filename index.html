<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة جي تشانغ ووك الخاصة</title>
    <style>
        body {
            background-color: #080808;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        #welcomeScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #080808 0%, #1a1a1a 100%);
            text-align: center;
        }

        #welcomeScreen h1 {
            font-size: 40px;
            color: #ff6b81;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 107, 129, 0.5);
        }

        .enter-btn {
            background: linear-gradient(45deg, #ff6b81, #ff4757);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 22px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 20px rgba(255, 107, 129, 0.3);
            margin-top: 30px;
            font-weight: bold;
        }

        .enter-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(255, 107, 129, 0.5);
        }

        #mainSite {
            display: none;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 36px;
            margin: 0;
            color: #fff;
        }

        header p {
            color: #aaa;
            font-size: 18px;
        }

        .video-section {
            max-width: 800px;
            margin: 0 auto 60px auto;
            background: #111;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #ff6b81;
        }

        .video-section h2 {
            color: #ff6b81;
            margin-top: 0;
            font-size: 28px;
        }

        video {
            width: 100%;
            border-radius: 15px;
            margin-top: 15px;
        }

        .gallery-section h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 30px;
            color: #ff6b81;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.4s;
            background: #151515;
            border: 1px solid #222;
        }

        .gallery-item:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 8px 20px rgba(255, 107, 129, 0.3);
            border-color: #ff6b81;
        }

        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }
        
        footer {
            text-align: center;
            margin-top: 80px;
            color: #555;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="welcomeScreen">
        <h1>مفاجأة خاصة لكِ!</h1>
        <p style="color: #ccc; font-size: 18px; margin-top: 10px;">اضغطي للدخول إلى عالم جي تشانغ ووك..</p>
        <button class="enter-btn" onclick="openSurprise()">دخول المفاجأة ✨</button>
    </div>

    <div id="mainSite">
        <header>
            <h1>Ji Chang Wook</h1>
            <p>My Special Collection</p>
        </header>

        <div class="video-section">
            <h2>🎬 خاص جداً</h2>
            <p style="color: #aaa; margin-bottom: 15px;">رسالة لكِ..</p>
            <video controls>
                <source src="رابط_فيديو_المكالمة_الخاص.mp4" type="video/mp4">
                متصفحك لا يدعم تشغيل الفيديو.
            </video>
        </div>

        <div class="gallery-section">
            <h2>Photo Gallery</h2>
            <div class="gallery-grid">
                <!-- استخدام روابط صور آمنة ومفتوحة مباشرة -->
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60" alt="Ji Chang Wook 1"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500&auto=format&fit=crop&q=60" alt="Ji Chang Wook 2"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500&auto=format&fit=crop&q=60" alt="Ji Chang Wook 3"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=500&auto=format&fit=crop&q=60" alt="Ji Chang Wook 4"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=60" alt="Ji Chang Wook 5"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=500&auto=format&fit=crop&q=60" alt="Ji Chang Wook 6"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500&auto=format&fit=crop&q=60" alt="Ji Chang Wook 7"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=500&auto=format&fit=crop&q=60" alt="Ji Chang Wook 8"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=500&auto=format&fit=crop&q=60" alt="Ji Chang Wook 9"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=500&auto=format&fit=crop&q=60" alt="Ji Chang Wook 10"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=500&auto=format&fit=crop&q=60" alt="Ji Chang Wook 11"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500&auto=format&fit=crop&q=60" alt="Ji Chang Wook 12"></div>
            </div>
        </div>
        
        <footer>
            <p>Created with love for Joud's Sister ❤️</p>
        </footer>
    </div>

    <script>
        function openSurprise() {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('mainSite').style.display = 'block';
            document.getElementById('mainSite').style.animation = 'fadeIn 1s ease-in-out';
        }
    </script>

</body>
</html>
