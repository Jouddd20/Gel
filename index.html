<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Surprise for You</title>
    <style>
        body {
            background-color: #0d0d0d; /* أسود فخم */
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace; /* خط أنيق ومناسب للمكالمات */
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        /* شاشة WAIT */
        #waitScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #waitScreen h1 {
            color: #ff6b81; /* الوردي الفاقع */
            font-size: 32px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        /* شاشة الرسالة */
        #messageScreen {
            display: none;
            padding: 40px 20px;
        }
        #messageScreen h1 {
            font-size: 22px;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        /* شاشة الفيديو */
        #videoScreen {
            display: none;
            padding: 20px;
        }
        video {
            width: 100%;
            max-width: 600px;
            border: 4px solid #ff6b81;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 107, 129, 0.3);
            display: block;
            margin: 0 auto;
        }
        /* شاشة النهاية */
        #endScreen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #endScreen h1 {
            color: #ff6b81;
            font-size: 28px;
            margin-bottom: 15px;
        }
        #endScreen p {
            font-size: 18px;
            color: #ccc;
        }
        /* زر الفتح */
        .open-btn {
            background: linear-gradient(45deg, #ff6b81, #ff4757);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 22px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s;
            box-shadow: 0 5px 20px rgba(255, 107, 129, 0.5);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .open-btn:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 8px 25px rgba(255, 107, 129, 0.7);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. شاشة WAIT الأولى -->
        <div id="waitScreen">
            <h1>WAIT…</h1>
            <p>Someone special wants to talk to you. 👀</p>
        </div>

        <!-- 2. شاشة الرسالة (بعد ضغط الزر في الخلفية) -->
        <div id="messageScreen">
            <h1>Here is your message…</h1>
            <button class="open-btn" onclick="showMessage()">OPEN MESSAGE 💌</button>
        </div>

        <!-- 3. شاشة الفيديو -->
        <div id="videoScreen">
            <!-- مكان الفيديو -->
            <video id="mainVideo" controls>
                <source src="رابط_فيديو_المكالمة_هنا.mp4" type="video/mp4">
                متصفحك لا يدعم عرض الفيديو.
            </video>
        </div>

        <!-- 4. شاشة النهاية -->
        <div id="endScreen">
            <h1>Okay… that was your surprise. 😂</h1>
            <p>Now go open your actual package. 📦</p>
        </div>
    </div>

    <script>
        const waitScreen = document.getElementById('waitScreen');
        const messageScreen = document.getElementById('messageScreen');
        const videoScreen = document.getElementById('videoScreen');
        const endScreen = document.getElementById('endScreen');
        const mainVideo = document.getElementById('mainVideo');

        // خطوة 1: الانتقال من WAIT إلى شاشة الرسالة
        setTimeout(() => {
            waitScreen.style.display = 'none';
            messageScreen.style.display = 'block';
        }, 3000); // تظهر شاشة WAIT لمدة 3 ثوانٍ

        // خطوة 2: عند الضغط على OPEN MESSAGE، يظهر الفيديو ويشتغل تلقائياً
        function showMessage() {
            messageScreen.style.display = 'none';
            videoScreen.style.display = 'block';
            mainVideo.play().catch(error => {
                console.log("Autoplay prevented: User needs to interact to play video.", error);
                // إذا المتصفح منع التشغيل التلقائي، المستخدم يضغط على زر التحكم في الفيديو نفسه
            });
        }

        // خطوة 3: عند انتهاء الفيديو، تظهر شاشة النهاية
        mainVideo.addEventListener('ended', () => {
            videoScreen.style.display = 'none';
            endScreen.style.display = 'flex';
        });

    </script>

</body>
</html>
