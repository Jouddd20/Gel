<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حضور المناوبات - الابتدائية الثالثة</title>
    <!-- مكتبة لربط وتسدير البيانات إلى ملف إكسل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-green: #1b5e20;
            --light-green: #2e7d32;
            --bg-green: #f1f8e9;
            --error-red: #d32f2f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-green);
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* رأس الصفحة */
        header {
            background-color: #ffffff;
            border-bottom: 3px solid var(--primary-green);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-right, .header-left {
            font-weight: bold;
            color: var(--primary-green);
            font-size: 1.1rem;
        }

        .datetime-display {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
        }

        /* محتوى النموذج */
        .container {
            max-width: 650px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h2 {
            text-align: center;
            color: var(--primary-green);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-green);
            outline: none;
        }

        /* لوحة التوقيع */
        .signature-container {
            border: 2px dashed #ccc;
            border-radius: 6px;
            background-color: #fafafa;
            position: relative;
            height: 150px;
            cursor: crosshair;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .clear-sig {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: #e0e0e0;
            border: none;
            padding: 4px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .clear-sig:hover {
            background: #d5d5d5;
        }

        /* زر الإرسال وتصدير الإكسل */
        .btn-submit {
            background-color: var(--primary-green);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: var(--light-green);
        }

        .btn-excel {
            background-color: #2e7d32;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-excel:hover {
            background-color: #1b5e20;
        }

        /* رسالة الخطأ الحمراء */
        #error-msg {
            color: var(--error-red);
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        /* جدول المعاينة المؤقتة للبيانات المخزنة */
        .export-section {
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <!-- رأس الصفحة -->
    <header>
        <div class="header-right">الابتدائية الثالثة</div>
        <div class="datetime-display" id="live-datetime">جاري تحميل الوقت...</div>
        <div class="header-left">وزارة التعليم</div>
    </header>

    <div class="container">
        <h2>تسجيل حضور المناوبات اليومية</h2>
        
        <div id="error-msg">عبي كل الخانات</div>

        <form id="duty-form">
            <div class="form-group">
                <label for="fullname">الاسم الثلاثي:</label>
                <input type="text" id="fullname" placeholder="أدخل اسمك الثلاثي هنا">
            </div>

            <div class="form-group">
                <label for="job-title">المسمى الوظيفي:</label>
                <select id="job-title">
                    <option value="">اختر المسمى الوظيفي</option>
                    <option value="معلمة">معلمة</option>
                    <option value="مساعد إداري">مساعد إداري</option>
                </select>
            </div>

            <div class="form-group">
                <label for="duty-type">نوع المناوبة:</label>
                <select id="duty-type">
                    <option value="">اختر نوع المناوبة</option>
                    <option value="صباحية">صباحية</option>
                    <option value="فسحة">فسحة</option>
                    <option value="انصراف">انصراف</option>
                </select>
            </div>

            <div class="form-group">
                <label for="duty-location">مكان المناوبة:</label>
                <select id="duty-location">
                    <option value="">اختر المكان</option>
                    <option value="الممر الرئيسي">الممر الرئيسي</option>
                    <option value="ممر سادس">ممر سادس</option>
                </select>
            </div>

            <div class="form-group">
                <label>التوقيع اليدوي (بالإصبع أو الفأرة):</label>
                <div class="signature-container">
                    <canvas id="sig-canvas"></canvas>
                    <button type="button" class="clear-sig" id="clear-canvas">مسح التوقيع</button>
                </div>
            </div>

            <button type="button" class="btn-submit" onclick="submitForm()">إرسال الحضور</button>
        </form>

        <div class="export-section">
            <button type="button" class="btn-excel" onclick="exportToExcel()">تحميل سجل الحضور (ملف Excel)</button>
        </div>
    </div>

    <script>
        // تحديث التاريخ والوقت الحي على يسار الموقع من فوق
        function updateDateTime() {
            const now = new Date();
            const options = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById('live-datetime').innerText = now.toLocaleString('ar-SA', options);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // إعداد لوحة التوقيع (Canvas) وتجاوبها مع اللمس (الأصبع) والفأرة
        const canvas = document.getElementById('sig-canvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let hasSigned = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        function startPosition(e) {
            painting = true;
            hasSigned = true;
            draw(e);
        }

        function endPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000';

            const rect = canvas.getBoundingClientRect();
            let x = (e.clientX || e.touches[0].clientX) - rect.left;
            let y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // مستشعرات الفأرة
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        // مستشعرات اللمس بالاصبع للأجهزة الذكية
        canvas.addEventListener('touchstart', (e) => { startPosition(e); e.preventDefault(); });
        canvas.addEventListener('touchend', (e) => { endPosition(); e.preventDefault(); });
        canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });

        // زر مسح التوقيع
        document.getElementById('clear-canvas').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasSigned = false;
        });

        // مصفوفة لتخزين البيانات محلياً وعرضها في الإكسل
        let attendanceRecords = [];

        // التحقق والإرسال
        function submitForm() {
            const fullname = document.getElementById('fullname').value.trim();
            const jobTitle = document.getElementById('job-title').value;
            const dutyType = document.getElementById('duty-type').value;
            const dutyLocation = document.getElementById('duty-location').value;
            const errorMsg = document.getElementById('error-msg');

            // التحقق من تعبئة جميع الخانات والتوقيع
            if (!fullname || !jobTitle || !dutyType || !dutyLocation || !hasSigned) {
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';

            // جلب التاريخ والوقت الحالي وقت الإرسال
            const submissionTime = new Date().toLocaleString('ar-SA');
            const signatureDataUrl = canvas.toDataURL(); // حفظ التوقيع كصورة مصغرة إن احتجت

            // حفظ البيانات في المصفوفة
            const record = {
                "التاريخ والوقت": submissionTime,
                "الاسم الثلاثي": fullname,
                "المسمى الوظيفي": jobTitle,
                "نوع المناوبة": dutyType,
                "مكان المناوبة": dutyLocation,
                "حالة التوقيع": "تم التوقيع بنجاح"
            };

            attendanceRecords.push(record);

            alert('تم تسجيل حضور المناوبة بنجاح!');
            
            // إعادة تعيين النموذج
            document.getElementById('duty-form').reset();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasSigned = false;
        }

        // تصدير البيانات إلى ملف Excel
        function exportToExcel() {
            if (attendanceRecords.length === 0) {
                alert('لا توجد بيانات مسجلة حتى الآن لتصديرها.');
                return;
            }

            const worksheet = XLSX.utils.json_to_sheet(attendanceRecords);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "سجل المناوبات");
            XLSX.writeFile(workbook, "سجل_حضور_المناوبات_الابتدائية_الثالثة.xlsx");
        }
    </script>
</body>
</html>
